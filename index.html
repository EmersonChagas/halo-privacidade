<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Family — Privacidade</title>
<meta name="description" content="Documentos legais do aplicativo Halo Family.">
<style>
  :root{--primaria:#6366F1;--violeta:#8B5CF6;--texto:#14103F;--cinza:#4B5563}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:#F8FAFC;color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:#fff;border-radius:20px;padding:36px 28px;max-width:520px;width:100%;
    box-shadow:0 12px 40px rgba(20,16,63,.08);
  }
  .logo{
    width:64px;height:64px;border-radius:18px;margin-bottom:20px;
    background:linear-gradient(135deg,var(--primaria),var(--violeta));
    display:flex;align-items:center;justify-content:center;
  }
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.4px}
  .sub{margin:0 0 28px;color:var(--cinza);font-size:15px}
  a.link{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-radius:14px;border:1px solid #E2E8F0;
    text-decoration:none;color:var(--texto);margin-bottom:12px;
    transition:border-color .15s,background .15s;
  }
  a.link:hover{border-color:var(--primaria);background:#F5F7FF}
  a.link strong{font-size:15.5px;font-weight:600;display:block}
  a.link span{font-size:13px;color:var(--cinza)}
  .seta{color:#94A3B8;font-size:20px}
  footer{margin-top:28px;font-size:12.5px;color:#94A3B8;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="18" r="9" fill="#fff"/>
        <circle cx="14" cy="27" r="6.5" fill="#fff"/>
        <circle cx="50" cy="27" r="6.5" fill="#fff"/>
        <path d="M32 32c-11 0-19 8-19 18v3h38v-3c0-10-8-18-19-18z" fill="#fff"/>
        <path d="M32 34c-7 0-12 5.5-12 12.5V52h24v-5.5C44 39.5 39 34 32 34z" fill="#6366F1"/>
      </svg>
    </div>

    <h1>Halo Family</h1>
    <p class="sub">Segurança hoje. Liberdade amanhã.</p>

    <a class="link" href="privacidade.html">
      <span>
        <strong>Política de Privacidade</strong>
        <span>O que coletamos, por quê e por quanto tempo</span>
      </span>
      <span class="seta">›</span>
    </a>

    <a class="link" href="exclusao.html">
      <span>
        <strong>Excluir minha conta</strong>
        <span>Como apagar sua conta e seus dados</span>
      </span>
      <span class="seta">›</span>
    </a>

    <footer>
      EMERSON DE SOUZA CHAGAS - CPF: 050.467.096-43<br>
      <a href="mailto:echagas@gmail.com" style="color:#6366F1">echagas@gmail.com</a>
    </footer>
  </div>
</body>
</html>
